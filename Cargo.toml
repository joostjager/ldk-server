[workspace]
resolver = "2"
members = ["ldk-server-cli", "ldk-server-client", "ldk-server-grpc", "ldk-server", "ldk-server-mcp"]
exclude = ["e2e-tests"]


[patch."https://github.com/lightningdevkit/ldk-node"]
ldk-node = { git = "https://github.com/joostjager/ldk-node", rev = "80199e3319568be42b05f850b8f1d824e8b1b5a2" }

[patch."https://github.com/lightningdevkit/rust-lightning"]
lightning = { git = "ssh://git@gitea-ssh.bitcoin.ninja/joostjager/rust-lightning.git", rev = "e8e5aae2cc22cdbf30eeda363c71dfb1011b471d" }
