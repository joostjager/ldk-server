lightning-net-tokio = { git = "ssh://git@gitea-ssh.bitcoin.ninja/joostjager/rust-lightning.git", rev = "e8e5aae2cc22cdbf30eeda363c71dfb1011b471d" }
lightning-persister = { git = "ssh://git@gitea-ssh.bitcoin.ninja/joostjager/rust-lightning.git", rev = "e8e5aae2cc22cdbf30eeda363c71dfb1011b471d" }
lightning-background-processor = { git = "ssh://git@gitea-ssh.bitcoin.ninja/joostjager/rust-lightning.git", rev = "e8e5aae2cc22cdbf30eeda363c71dfb1011b471d" }
lightning-rapid-gossip-sync = { git = "ssh://git@gitea-ssh.bitcoin.ninja/joostjager/rust-lightning.git", rev = "e8e5aae2cc22cdbf30eeda363c71dfb1011b471d" }
